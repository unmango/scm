name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  pulumi:
    runs-on: thecluster
    concurrency:
      group: pulumi-prod
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # WORKAROUND: --fallback on every `nix develop` builds from source when a substitute
      # fails. The in-cluster ncps cache has been serving a truncated pulumi NAR; remove
      # --fallback once that cache is fixed.
      - name: Dprint check
        if: github.event_name == 'pull_request'
        run: nix develop --fallback -c dprint check

      - name: Lint
        if: github.event_name == 'pull_request'
        run: nix develop --fallback -c make lint

      - name: Pulumi login
        uses: pulumi/auth-actions@v2
        with:
          organization: UnstoppableMango
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:UnstoppableMango

      - name: Set Pulumi flags
        run: |
          flags=""
          if [ "${{ github.actor }}" = "renovate[bot]" ]; then
            flags="$flags --expect-no-changes"
          fi
          echo "PULUMI_FLAGS=$flags" >> "$GITHUB_ENV"

      - name: Preview
        if: github.event_name == 'pull_request'
        run: nix develop --fallback -c make preview

      - name: Deploy
        if: github.event_name == 'push'
        env:
          PULUMI_FLAGS: --yes ${{ env.PULUMI_FLAGS }}
        run: nix develop --fallback -c make up
